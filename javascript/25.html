<!DOCTYPE html>
<html>
<head>
    <title>Show Hide</title>
</head>

<body>

<p id="text">
    This text can be hidden or shown.
</p>

<button onclick="hideText()">
    Hide
</button>

<button onclick="showText()">
    Show
</button>

<script>

function hideText() {
    document.getElementById("text").style.display = "none";
}

function showText() {
    document.getElementById("text").style.display = "block";
}

</script>

</body>
</html>
