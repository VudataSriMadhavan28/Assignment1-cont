<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 80px;
        }

        #timer {
            font-size: 60px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            width: 100px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
        }
    </style>
</head>

<body>

<h2>Countdown Timer</h2>

<input
    type="number"
    id="secondsInput"
    placeholder="Seconds"
>

<button onclick="startTimer()">
    Start
</button>

<div id="timer">
    00:00
</div>

<script>

let countdown;

function startTimer() {

    clearInterval(countdown);

    let seconds =
        Number(document.getElementById("secondsInput").value);

    if (seconds <= 0) {
        alert("Please enter a valid number of seconds.");
        return;
    }

    updateTimer(seconds);

    countdown = setInterval(function() {

        seconds--;

        updateTimer(seconds);

        if (seconds <= 0) {

            clearInterval(countdown);

            alert("Time's up!");

        }

    }, 1000);
}

function updateTimer(seconds) {

    let minutes =
        Math.floor(seconds / 60);

    let remainingSeconds =
        seconds % 60;

    minutes =
        String(minutes).padStart(2, "0");

    remainingSeconds =
        String(remainingSeconds).padStart(2, "0");

    document.getElementById("timer").innerHTML =
        minutes + ":" + remainingSeconds;
}

</script>

</body>
</html>
