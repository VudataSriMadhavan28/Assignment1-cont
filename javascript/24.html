<!DOCTYPE html>
<html>
<head>
    <title>Button Event</title>
</head>

<body>

<h2 id="message">Click the button</h2>

<button id="myButton">
    Click Me
</button>

<script>

document.getElementById("myButton").addEventListener("click", function() {

    document.getElementById("message").innerHTML =
        "Button was clicked!";

});

</script>

</body>
</html>
