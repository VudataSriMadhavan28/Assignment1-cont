<!DOCTYPE html>
<html>
<head>
    <title>Change Image</title>
</head>

<body>

<img
    id="myImage"
    src="https://picsum.photos/300/200?1"
    width="300"
>

<br><br>

<button onclick="changeImage()">
    Change Image
</button>

<script>

function changeImage() {

    document.getElementById("myImage").src =
        "https://picsum.photos/300/200?2";

}

</script>

</body>
</html>
