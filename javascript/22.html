<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
</head>

<body>

<h2 id="message">Hello Student!</h2>

<button onclick="changeText()">
    Change Text
</button>

<script>
function changeText() {
    document.getElementById("message").innerHTML =
        "Welcome to JavaScript!";
}
</script>

</body>
</html>
