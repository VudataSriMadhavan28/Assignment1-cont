<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px;
        }

        li {
            margin: 10px;
            list-style: none;
        }

        .delete {
            margin-left: 10px;
            color: red;
        }
    </style>
</head>

<body>

<h2>My To-Do List</h2>

<input
    type="text"
    id="task"
    placeholder="Enter a task"
>

<button onclick="addTask()">
    Add
</button>

<ul id="taskList"></ul>

<script>

function addTask() {

    let task =
        document.getElementById("task").value;

    if (task === "") {
        alert("Please enter a task.");
        return;
    }

    let li = document.createElement("li");

    li.innerHTML =
        task +
        ' <button class="delete" onclick="this.parentElement.remove()">Delete</button>';

    document.getElementById("taskList").appendChild(li);

    document.getElementById("task").value = "";
}

</script>

</body>
</html>
