<!DOCTYPE html>
<html>
<head>
    <title>Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
        }

        ol {
            list-style-type: upper-roman;
        }

        table {
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 2px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: navy;
            color: white;
        }

        tr:nth-child(even) {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h1>CSS Lists</h1>

    <ul>
        <li>Python</li>
        <li>C Programming</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <ol>
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
    </ol>

    <h1>Student Table</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>CSE</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>AIML</td>
            <td>95</td>
        </tr>
    </table>

</body>
</html>
