<!DOCTYPE html>
<html>
<head>
    <style>

        .linear {
            height: 150px;
            background: linear-gradient(to right, blue, purple);
            color: white;
            padding: 50px;
            text-align: center;
        }

        .radial {
            height: 150px;
            background: radial-gradient(circle, yellow, orange, red);
            padding: 50px;
            text-align: center;
        }

    </style>
</head>

<body>

<div class="linear">
    Linear Gradient
</div>

<br>

<div class="radial">
    Radial Gradient
</div>

</body>
</html>
