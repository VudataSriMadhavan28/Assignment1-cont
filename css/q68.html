<!DOCTYPE html>
<html>
<head>
    <title>Loading Spinner</title>

    <style>
        .spinner {
            width: 60px;
            height: 60px;

            border: 8px solid #ddd;
            border-top: 8px solid blue;

            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin: 100px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="spinner"></div>

</body>
</html>
