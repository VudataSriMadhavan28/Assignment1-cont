<!DOCTYPE html>
<html>
<head>
    <style>

        .card {
            width: 300px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;

            box-shadow: 0 5px 15px #999;
        }

        h1 {
            text-shadow: 3px 3px 5px #aaa;
        }

    </style>
</head>

<body>

<div class="card">
    <h1>Hello!</h1>
    <p>This card has a box shadow.</p>
</div>

</body>
</html>
