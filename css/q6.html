<!DOCTYPE html>
<html>
<head>
    <title>Width and Height</title>

    <style>
        .fixed {
            width: 300px;
            height: 150px;
            background-color: lightblue;
            margin: 10px;
        }

        .percentage {
            width: 50%;
            height: 100px;
            background-color: lightgreen;
            margin: 10px;
        }

        .max {
            width: 80%;
            max-width: 500px;
            min-height: 100px;
            background-color: orange;
            margin: 10px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Sizing Properties</h1>

    <div class="fixed">Fixed Width and Height</div>

    <div class="percentage">Percentage Width</div>

    <div class="max">Maximum and Minimum Sizing</div>

</body>
</html>
