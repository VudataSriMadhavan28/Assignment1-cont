<!DOCTYPE html>
<html>
<head>
    <style>

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .gallery img {
            width: calc(25% - 15px);
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .gallery img {
                width: calc(50% - 15px);
            }
        }

        @media (max-width: 400px) {
            .gallery img {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<div class="gallery">
    <img src="https://picsum.photos/400/300?1">
    <img src="https://picsum.photos/400/300?2">
    <img src="https://picsum.photos/400/300?3">
    <img src="https://picsum.photos/400/300?4">
</div>

</body>
</html>
