<!DOCTYPE html>
<html>
<head>
    <style>

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: sticky;
            top: 0;
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 100;
        }

        section {
            height: 500px;
            padding: 30px;
        }

    </style>
</head>

<body>

<header>
    <h2>My Sticky Header</h2>
</header>

<section>
    <h1>Section 1</h1>
    <p>Scroll down and the header will remain at the top.</p>
</section>

<section>
    <h1>Section 2</h1>
    <p>This section demonstrates sticky positioning.</p>
</section>

<section>
    <h1>Section 3</h1>
    <p>The header stays visible while scrolling.</p>
</section>

</body>
</html>
