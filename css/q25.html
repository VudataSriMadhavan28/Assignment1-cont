<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: #e8f1ff;
        }

        .hero h1 {
            font-size: 45px;
        }

        .hero button {
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .about {
            padding: 50px;
            text-align: center;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h2>MyWebsite</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to My Website</h1>
    <p>Simple websites made with HTML and CSS.</p>
    <button>Get Started</button>
</section>

<section class="about">
    <h2>About Us</h2>
    <p>
        We create simple and beautiful websites for everyone.
    </p>
</section>

<footer>
    <p>© 2026 MyWebsite. All Rights Reserved.</p>
</footer>

</body>
</html>
