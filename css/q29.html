<!DOCTYPE html>
<html>
<head>
    <style>

        :root {
            --main-color: #007bff;
            --text-color: white;
            --spacing: 20px;
        }

        body {
            font-family: Arial;
        }

        .box {
            background: var(--main-color);
            color: var(--text-color);
            padding: var(--spacing);
            margin: var(--spacing);
        }

    </style>
</head>

<body>

<div class="box">
    <h2>CSS Variables</h2>
    <p>This design uses custom properties.</p>
</div>

</body>
</html>
