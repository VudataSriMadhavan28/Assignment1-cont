<!DOCTYPE html>
<html>
<head>
    <style>

        .tooltip {
            position: relative;
            display: inline-block;
            margin: 100px;
        }

        .message {
            visibility: hidden;
            background: black;
            color: white;
            padding: 8px;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
        }

        .tooltip:hover .message {
            visibility: visible;
        }

    </style>
</head>

<body>

<div class="tooltip">
    Hover over me

    <span class="message">
        This is a tooltip!
    </span>
</div>

</body>
</html>
