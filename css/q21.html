<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eef2f7;
        }

        .profile {
            width: 500px;
            max-width: 90%;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px gray;
            text-align: center;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        .profile h1 {
            color: navy;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }

        .details p {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .skills span {
            display: inline-block;
            background-color: navy;
            color: white;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="https://img.freepik.com/premium-photo/close-up-smiling-male-university-student-isolated-white-background-boy-life_49047-1459.jpg?w=2000" alt="Student">

        <h1>Vudata Sri Madhavan</h1>

        <p>B.Tech Computer Science Student</p>

        <div class="details">

            <p><strong>College:</strong> Sai University</p>

            <p><strong>Year:</strong> 2nd Year</p>

            <p><strong>Department:</strong> Computer Science</p>

            <p><strong>Email:</strong> student@example.com</p>

        </div>

        <h3>Skills</h3>

        <div class="skills">
            <span>Python</span>
            <span>C</span>
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
        </div>

    </div>

</body>
</html>
