<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navigation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        nav {
            background-color: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
        }

        @media screen and (max-width: 600px) {

            nav {
                flex-direction: column;
            }

            .menu {
                flex-direction: column;
                text-align: center;
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">MyWebsite</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </div>

    </nav>

</body>
</html>
