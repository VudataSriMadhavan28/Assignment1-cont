<!DOCTYPE html>
<html>
<head>
    <title>Fixed Sidebar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: #222;
            padding-top: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 15px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #444;
        }

        .content {
            margin-left: 220px;
            padding: 30px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</div>

<div class="content">
    <h1>My Website</h1>
    <p>
        This is the main content area. The sidebar stays fixed
        even when we scroll the page.
    </p>

    <p>
        Keep scrolling to see how the sidebar remains in place.
    </p>

    <div style="height: 800px;"></div>
</div>

</body>
</html>
