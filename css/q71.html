<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode</title>

    <style>
        :root {
            --background: white;
            --text: #222;
            --card: #eeeeee;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: var(--background);
            color: var(--text);
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
        }

        .card {
            background: var(--card);
            padding: 30px;
        }

        .dark {
            --background: #121212;
            --text: white;
            --card: #222;
        }
    </style>
</head>

<body class="dark">

<div class="container">

    <h1>Dark Mode Website</h1>

    <div class="card">
        <h2>Welcome!</h2>
        <p>
            CSS variables make it easy to change the
            colors of the entire website.
        </p>
    </div>

</div>

</body>
</html>
