<!DOCTYPE html>
<html>
<head>
    <style>

        .square {
            width: 150px;
            height: 150px;
            background: blue;
        }

        .rounded {
            width: 150px;
            height: 150px;
            background: green;
            border-radius: 20px;
        }

        .circle {
            width: 150px;
            height: 150px;
            background: red;
            border-radius: 50%;
        }

    </style>
</head>

<body>

<div class="square"></div>
<br>

<div class="rounded"></div>
<br>

<div class="circle"></div>

</body>
</html>
