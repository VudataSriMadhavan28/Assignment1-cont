<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>
        h1 {
            font-family: Arial;
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            color: darkblue;
        }

        p {
            font-family: Georgia;
            font-size: 20px;
            line-height: 1.8;
            text-align: justify;
            text-transform: capitalize;
            letter-spacing: 2px;
        }

        .underline {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Font Properties</h1>

    <p>
        This paragraph demonstrates different font and text formatting properties.
    </p>

    <p class="underline">
        This text is underlined.
    </p>

</body>
</html>
