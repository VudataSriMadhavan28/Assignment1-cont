<!DOCTYPE html>
<html>
<head>
    <title>Food Corner</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: #8b0000;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 40px;
        }

        .food {
            width: 250px;
            background: #fff3e6;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .food img {
            width: 100%;
            border-radius: 8px;
        }

        .price {
            color: #8b0000;
            font-weight: bold;
            font-size: 20px;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Food Corner</h1>
    <p>Fresh food, happy moments!</p>
</header>

<section class="menu">

    <div class="food">
        <img src="pizza(1).jpg">
        <h2>Pizza</h2>
        <p>Cheesy and delicious pizza.</p>
        <p class="price">₹299</p>
    </div>

    <div class="food">
        <img src="burger.jpg">
        <h2>Burger</h2>
        <p>Fresh burger with crispy fries.</p>
        <p class="price">₹199</p>
    </div>

    <div class="food">
        <img src="pasta.jpg">
        <h2>Pasta</h2>
        <p>Creamy and tasty pasta.</p>
        <p class="price">₹249</p>
    </div>

</section>

<footer>
    Visit us today!
</footer>

</body>
</html>
