<!DOCTYPE html>
<html>
<head>
    <title>Float and Clear</title>

    <style>
        img {
            width: 150px;
            height: 150px;
            float: left;
            margin-right: 20px;
        }

        .clear {
            clear: both;
            background-color: lightblue;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Float and Clear</h1>

    <img src="https://wallpapercave.com/wp/wp9015951.jpg" alt="Sample Image">

    <p>
        This text flows around the image because the image is floated to the left.
        Float allows elements to move to the left or right of their container.
    </p>

    <div class="clear">
        This section uses clear: both.
    </div>

</body>
</html>
