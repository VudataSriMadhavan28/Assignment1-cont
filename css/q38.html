<!DOCTYPE html>
<html>
<head>
    <style>

        .visible {
            background: green;
            color: white;
            padding: 20px;
        }

        .hidden {
            visibility: hidden;
            background: red;
            padding: 20px;
        }

    </style>
</head>

<body>

<div class="visible">
    I am visible.
</div>

<div class="hidden">
    I am hidden, but my space is still there.
</div>

</body>
</html>
