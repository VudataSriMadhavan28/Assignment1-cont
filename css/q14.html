<!DOCTYPE html>
<html>
<head>
    <title>Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            background-color: lightgray;
            padding: 30px;
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: steelblue;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox</h1>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>

    </div>

</body>
</html>
