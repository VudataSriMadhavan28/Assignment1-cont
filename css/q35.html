<!DOCTYPE html>
<html>
<head>
    <style>

        .box {
            width: 300px;
            height: 100px;
            border: 2px solid black;
            overflow: auto;
        }

    </style>
</head>

<body>

<div class="box">
    This box contains more text than it can display at once.
    Therefore, the overflow property allows us to scroll through
    the additional content instead of letting it break the layout.
</div>

</body>
</html>
