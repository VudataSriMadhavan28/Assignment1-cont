<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;

            /* Content */
            height: 150px;

            /* Padding */
            padding: 30px;

            /* Border */
            border: 10px solid blue;

            /* Margin */
            margin: 50px;

            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        Content Area
        <br><br>
        Padding → Border → Margin
    </div>

</body>
</html>
