<!DOCTYPE html>
<html>
<head>
    <style>

        .normal {
            background: blue;
            padding: 30px;
            color: white;
        }

        .transparent {
            background: rgba(0, 0, 255, 0.4);
            padding: 30px;
            color: white;
        }

        .opacity {
            background: red;
            padding: 30px;
            color: white;
            opacity: 0.5;
        }

    </style>
</head>

<body>

<div class="normal">Normal</div>
<br>

<div class="transparent">Transparent background</div>
<br>

<div class="opacity">50% Opacity</div>

</body>
</html>
