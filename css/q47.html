<!DOCTYPE html>
<html>
<head>
    <style>

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr;
            min-height: 100vh;
        }

        header {
            grid-column: 1 / 3;
            background: #222;
            color: white;
            padding: 20px;
        }

        aside {
            background: #eee;
            padding: 20px;
        }

        main {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #ddd;
            padding: 30px;
            text-align: center;
        }

    </style>
</head>

<body>

<div class="dashboard">

    <header>
        <h2>My Dashboard</h2>
    </header>

    <aside>
        <p>Dashboard</p>
        <p>Users</p>
        <p>Settings</p>
    </aside>

    <main>
        <h1>Overview</h1>

        <div class="cards">
            <div class="card">Users<br>1,200</div>
            <div class="card">Orders<br>450</div>
            <div class="card">Revenue<br>₹50,000</div>
        </div>
    </main>

</div>

</body>
</html>
