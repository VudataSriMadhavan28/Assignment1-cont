<!DOCTYPE html>
<html>
<head>
    <style>

        .container {
            display: flex;
            gap: 20px;
        }

        .column {
            flex: 1;
            padding: 30px;
            background: #eee;
            text-align: center;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <div class="column">
        <h2>Column 1</h2>
        <p>First section</p>
    </div>

    <div class="column">
        <h2>Column 2</h2>
        <p>Second section</p>
    </div>

    <div class="column">
        <h2>Column 3</h2>
        <p>Third section</p>
    </div>

</div>

</body>
</html>
