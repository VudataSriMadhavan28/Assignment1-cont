<!DOCTYPE html>
<html>
<head>
    <style>

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .content {
            background: lightblue;
            padding: 30px;
        }

        .sidebar {
            background: lightgray;
            padding: 30px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <main class="content">
        <h2>Main Content</h2>
        <p>This is the main section of the webpage.</p>
    </main>

    <aside class="sidebar">
        <h2>Sidebar</h2>
        <p>Additional information goes here.</p>
    </aside>

</div>

</body>
</html>
