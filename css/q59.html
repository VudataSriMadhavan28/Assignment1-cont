<!DOCTYPE html>
<html>
<head>
    <title>Daily News</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .article {
            background: #f4f4f4;
            padding: 25px;
            margin-bottom: 20px;
        }

        .sidebar {
            background: #eeeeee;
            padding: 25px;
        }

        @media (max-width: 700px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header style="background:#222;color:white;padding:25px;">
    <h1>Daily News</h1>
</header>

<div class="layout">

    <main>

        <article class="article">
            <h2>Technology is Changing Our World</h2>
            <p>
                Technology continues to change the way we work,
                learn and communicate.
            </p>
        </article>

        <article class="article">
            <h2>New Trends in Education</h2>
            <p>
                Modern education is becoming more interactive
                and accessible.
            </p>
        </article>

    </main>

    <aside class="sidebar">
        <h2>Latest Posts</h2>
        <p>Future of AI</p>
        <p>Web Development Trends</p>
        <p>Student Innovation</p>
    </aside>

</div>

</body>
</html>
