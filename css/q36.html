<!DOCTYPE html>
<html>
<head>
    <style>

        .box {
            width: 150px;
            height: 150px;
            position: absolute;
        }

        .red {
            background: red;
            left: 50px;
            top: 50px;
            z-index: 1;
        }

        .blue {
            background: blue;
            left: 100px;
            top: 100px;
            z-index: 2;
        }

    </style>
</head>

<body>

<div class="box red"></div>
<div class="box blue"></div>

</body>
</html>
