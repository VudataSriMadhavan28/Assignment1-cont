<!DOCTYPE html>
<html>
<head>
    <style>

        button {
            padding: 15px 30px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background: purple;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px #999;
        }

    </style>
</head>

<body>

<button>Hover Me</button>

</body>
</html>
