<!DOCTYPE html>
<html>
<head>
    <title>Colors Backgrounds Borders</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
            background-color: white;
            border: 3px solid navy;
            padding: 15px;
            text-align: center;
        }

        p {
            color: white;
            background-color: green;
            border: 4px dashed yellow;
            padding: 20px;
        }

        .box {
            background-image: linear-gradient(to right, skyblue, purple);
            border: 5px double black;
            padding: 30px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <p>This paragraph demonstrates colors and borders.</p>

    <div class="box">
        Background demonstration
    </div>

</body>
</html>
