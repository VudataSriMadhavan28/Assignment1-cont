<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .card {
            width: 280px;
            background: white;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px #bbb;
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        .card h2 {
            margin: 15px 0 5px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <img src="https://via.placeholder.com/280x180" alt="Product">
    <h2>Wireless Headphones</h2>
    <p>Comfortable headphones with clear sound.</p>
    <p class="price">₹1,999</p>
    <button class="btn">Buy Now</button>
</div>

</body>
</html>
