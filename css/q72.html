<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            font-size: 8vw;
        }

        p {
            font-size: 2.5vw;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
            }

            p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<h1>Responsive Heading</h1>

<p>
    The text size changes according to the screen size.
</p>

</body>
</html>
