<!DOCTYPE html>
<html>
<head>
    <style>

        .menu {
            position: relative;
            display: inline-block;
        }

        .button {
            background: #333;
            color: white;
            padding: 12px 20px;
            cursor: pointer;
        }

        .dropdown {
            display: none;
            position: absolute;
            background: white;
            box-shadow: 0 4px 10px #aaa;
        }

        .dropdown a {
            display: block;
            padding: 10px 20px;
            text-decoration: none;
            color: black;
        }

        .menu:hover .dropdown {
            display: block;
        }

    </style>
</head>

<body>

<div class="menu">

    <div class="button">Menu</div>

    <div class="dropdown">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

</div>

</body>
</html>
