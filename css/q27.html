<!DOCTYPE html>
<html>
<head>
    <style>

        /* Universal selector */
        * {
            box-sizing: border-box;
        }

        /* Element selector */
        p {
            color: blue;
        }

        /* Class selector */
        .highlight {
            background: yellow;
        }

        /* ID selector */
        #title {
            color: red;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid green;
        }

        /* Grouping selector */
        h1, h2 {
            font-family: Arial;
        }

    </style>
</head>

<body>

<h1 id="title">CSS Selectors</h1>
<h2>Different Selectors</h2>

<p>This is a paragraph.</p>

<p class="highlight">This paragraph has a class.</p>

<input type="text" placeholder="Enter your name">

</body>
</html>
