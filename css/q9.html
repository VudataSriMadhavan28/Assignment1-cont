<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        nav {
            background-color: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
