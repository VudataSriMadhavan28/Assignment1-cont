<!DOCTYPE html>
<html>
<head>
    <style>

        .block {
            display: block;
            background: lightblue;
        }

        .inline {
            display: inline;
            background: yellow;
        }

        .inline-block {
            display: inline-block;
            background: lightgreen;
            padding: 20px;
        }

        .hidden {
            display: none;
        }

    </style>
</head>

<body>

<div class="block">Block Element</div>

<p>
    This is
    <span class="inline">Inline</span>
    text.
</p>

<div class="inline-block">
    Inline Block
</div>

<div class="hidden">
    You cannot see me.
</div>

</body>
</html>
