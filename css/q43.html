<!DOCTYPE html>
<html>
<head>
    <style>

        .blur {
            filter: blur(4px);
        }

        .gray {
            filter: grayscale(100%);
        }

        .bright {
            filter: brightness(150%);
        }

        .contrast {
            filter: contrast(200%);
        }

        img {
            width: 200px;
            margin: 10px;
        }

    </style>
</head>

<body>

<img class="blur" src="https://picsum.photos/200/150">
<img class="gray" src="https://picsum.photos/200/150">
<img class="bright" src="https://picsum.photos/200/150">
<img class="contrast" src="https://picsum.photos/200/150">

</body>
</html>
