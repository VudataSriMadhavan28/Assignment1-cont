<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>
        /* Element selector */
        h1 {
            color: blue;
        }

        /* ID selector */
        #special {
            color: red;
        }

        /* Class selector */
        .highlight {
            background-color: yellow;
        }

        /* Universal selector */
        * {
            font-family: Arial;
        }

        /* Group selector */
        h2, p {
            margin: 10px;
        }

        /* Attribute selector */
        input[type="text"] {
            border: 2px solid green;
        }
    </style>
</head>

<body>

    <h1>Element Selector</h1>

    <h2 id="special">ID Selector</h2>

    <p class="highlight">Class Selector</p>

    <input type="text" placeholder="Attribute Selector">

</body>
</html>
