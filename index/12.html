<!DOCTYPE html>
<html>
<head>
    <title>CSS Properties</title>

    <style>
        /* Element selector */
        h1 {
            color: darkblue;
            text-align: center;
        }

        /* Class selector */
        .description {
            color: green;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }

        /* ID selector */
        #special {
            background-color: lightyellow;
            padding: 15px;
            margin: 20px;
            border: 2px solid orange;
        }

        /* Group selector */
        h2, p {
            margin-bottom: 10px;
        }

        /* Universal selector */
        * {
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h1>CSS Styling Demonstration</h1>

    <h2>About CSS</h2>

    <p class="description">
        CSS is used to style HTML webpages.
    </p>

    <div id="special">
        This box demonstrates background color, padding, margin, and border.
    </div>

</body>
</html>
